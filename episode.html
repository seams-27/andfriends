<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Palanquin:wght@400;500;600&family=Trirong:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><title>&amp;friends</title></head><body><header><a class="logo" href="index.html">&amp;friends</a><a class="nav" href="index.html">Episodes</a><a class="nav" href="web.html">The web</a></header><main id="ep"></main><script src="data.js"></script><script src="common.js"></script><script>
const id=+new URLSearchParams(location.search).get("id");
const i=EPISODES.findIndex(e=>e.id===id), e=EPISODES[i], main=document.getElementById("ep");
if(!e){main.innerHTML='<h1>Episode not found</h1><p><a href="index.html">Back to all episodes</a></p>';}
else{
document.title=e.artist+" | &friends";
const f=canon(e.artist), others=EPISODES.filter(x=>x.id!==e.id), url=x=>`episode.html?id=${x.id}`;
const own=Object.fromEntries(EPISODES.map(x=>[canon(x.artist),x]));
const embed=s=>!s?'<div class="embed">The player will appear here once you add this episode\'s SoundCloud link in data.js.</div>':s.trim().startsWith("<")?`<div class="embed live">${s}</div>`:`<div class="embed live"><iframe title="${e.artist} episode player" height="166" allow="autoplay" src="https://w.soundcloud.com/player/?url=${encodeURIComponent(s)}&color=%23000000&show_teaser=false"></iframe></div>`;
const bridges=epPeople(e).map(p=>({p,eps:others.filter(x=>canon(x.artist)===p||epPeople(x).includes(p))})).filter(b=>b.eps.length).sort((a,b)=>b.eps.length-a.eps.length);
const tr=t=>`<li><b>${t[0]}</b> <span class="by">${t[1]}${t[3]?" with "+t[3].replace(/;/g,","):""}</span>${t[2]?`<small>${t[2]}</small>`:""}${t[4]?`<em>${t[4]}</em>`:""}</li>`;
main.innerHTML=`<p class="hint">Episode ${pad(e.id)}${e.date?" · "+e.date:""}</p><h1>${e.artist}</h1>${embed(e.soundcloud)}
${e.notes?"<h2>Notes</h2><p>"+e.notes+"</p>":""}
${e.tracks.length?"<h2>Tracklist</h2><ol class=\"tracks\">"+e.tracks.map(tr).join("")+"</ol>":"<p>The tracklist is coming soon.</p>"}
${bridges.length?"<h2>Connections to other episodes</h2><ul class=\"collabs\">"+bridges.map(b=>"<li>"+(own[b.p]?'<a href="'+url(own[b.p])+'">'+b.p+"</a>":b.p)+" <span>also in "+b.eps.map(x=>'<a href="'+url(x)+'">'+x.artist+"</a>").join(", ")+"</span></li>").join("")+"</ul>":""}
<p><a href="web.html#${encodeURIComponent(f)}">See ${e.artist} in the web</a></p>
<div class="pager"><span>${EPISODES[i-1]?'<a href="'+url(EPISODES[i-1])+'">Previous: '+EPISODES[i-1].artist+"</a>":""}</span><span>${EPISODES[i+1]?'<a href="'+url(EPISODES[i+1])+'">Next: '+EPISODES[i+1].artist+"</a>":""}</span></div>`;
}
</script></body></html>
